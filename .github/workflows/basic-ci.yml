name: Documentation and script checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shell-syntax:
    name: RFSoC audit shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check shell syntax without executing scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          scripts = sorted(Path('upgrade-audit/rfsoc-2025').rglob('*.sh'))
          if not scripts:
              raise SystemExit('No audit shell scripts found')

          for script in scripts:
              print(f'Checking {script}', flush=True)
              subprocess.run(['bash', '-n', str(script)], check=True)

          print(f'SHELL_SYNTAX_PASS: {len(scripts)} scripts')
          PY

  docs-html:
    name: Sphinx HTML strict build (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip check

      - name: Record environment
        run: |
          mkdir -p build/ci-docs
          python --version > build/ci-docs/python-version.txt
          python -m pip freeze > build/ci-docs/python-packages.txt

      - name: Build HTML with warnings treated as errors
        run: |
          python -m sphinx -b html -E -a -W --keep-going \
            -w build/ci-docs/warnings.log \
            docs build/ci-docs/html \
            2>&1 | tee build/ci-docs/build.log

      - name: Save build logs and HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-build
          path: build/ci-docs/
          if-no-files-found: ignore
          retention-days: 7
